<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Camera Circle</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f1ea;
        color: #202124;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(100%, 560px);
        padding: 32px 20px;
        display: grid;
        justify-items: center;
        gap: 24px;
      }

      .camera-frame {
        width: min(400px, calc(100vw - 40px));
        aspect-ratio: 1;
        border-radius: 50%;
        overflow: hidden;
        background: #1f2933;
        border: 8px solid #ffffff;
        box-shadow: 0 24px 70px rgba(22, 26, 31, 0.22);
        display: grid;
        place-items: center;
        position: relative;
      }

      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        display: none;
      }

      .camera-frame.is-ready video {
        display: block;
      }

      .status {
        max-width: 310px;
        padding: 0 28px;
        color: #f7f7f7;
        font-size: 16px;
        line-height: 1.45;
        text-align: center;
      }

      .camera-frame.is-ready .status {
        display: none;
      }

      .result-panel {
        min-width: min(320px, calc(100vw - 40px));
        padding: 14px 18px;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 10px 30px rgba(22, 26, 31, 0.12);
        text-align: center;
      }

      .result-label {
        margin: 0;
        color: #5f6368;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .result-value {
        margin: 5px 0 0;
        color: #202124;
        font-size: 28px;
        font-weight: 800;
        line-height: 1.15;
      }

      .result-score {
        margin: 6px 0 0;
        color: #5f6368;
        font-size: 14px;
      }

      .result-panel.is-smiling .result-value {
        color: #0f766e;
      }

      .result-panel.is-not-smiling .result-value {
        color: #9f1239;
      }

      button {
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 6px;
        background: #0f766e;
        color: #ffffff;
        font: 700 15px Arial, Helvetica, sans-serif;
        cursor: pointer;
      }

      button:hover {
        background: #115e59;
      }

      button:focus-visible {
        outline: 3px solid #14b8a6;
        outline-offset: 3px;
      }

      @media (max-width: 440px) {
        main {
          gap: 18px;
        }

        .camera-frame {
          border-width: 6px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="camera-frame" id="cameraFrame">
        <video id="cameraVideo" autoplay playsinline muted></video>
        <p class="status" id="statusText">Camera permission is needed to show your video here.</p>
      </div>

      <section class="result-panel" id="resultPanel" aria-live="polite">
        <p class="result-label">Expression</p>
        <p class="result-value" id="resultValue">Waiting</p>
        <p class="result-score" id="resultScore">Smile score: --</p>
      </section>

      <button id="startButton" type="button">Allow camera</button>
    </main>

    <script type="module">
      import {
        FaceLandmarker,
        FilesetResolver
      } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/vision_bundle.mjs";

      const frame = document.getElementById("cameraFrame");
      const video = document.getElementById("cameraVideo");
      const statusText = document.getElementById("statusText");
      const startButton = document.getElementById("startButton");
      const resultPanel = document.getElementById("resultPanel");
      const resultValue = document.getElementById("resultValue");
      const resultScore = document.getElementById("resultScore");

      const smileThreshold = 0.35;
      let faceLandmarker;
      let animationFrameId;
      let lastVideoTime = -1;
      let smoothedSmileScore = 0;

      async function loadFaceLandmarker() {
        if (faceLandmarker) {
          return faceLandmarker;
        }

        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.35/wasm"
        );

        const options = {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
            delegate: "GPU"
          },
          numFaces: 1,
          outputFaceBlendshapes: true,
          runningMode: "VIDEO"
        };

        try {
          faceLandmarker = await FaceLandmarker.createFromOptions(vision, options);
        } catch (error) {
          options.baseOptions.delegate = "CPU";
          faceLandmarker = await FaceLandmarker.createFromOptions(vision, options);
        }

        return faceLandmarker;
      }

      function setResult(state, score) {
        resultPanel.classList.toggle("is-smiling", state === "smiling");
        resultPanel.classList.toggle("is-not-smiling", state === "not-smiling");

        if (state === "smiling") {
          resultValue.textContent = "Smiling";
        } else if (state === "not-smiling") {
          resultValue.textContent = "Not smiling";
        } else {
          resultValue.textContent = "Looking for face";
        }

        resultScore.textContent =
          typeof score === "number"
            ? `Smile score: ${Math.round(score * 100)}%`
            : "Smile score: --";
      }

      function getBlendshapeScore(categories, categoryName) {
        const match = categories.find((category) => category.categoryName === categoryName);
        return match ? match.score : 0;
      }

      function readSmileScore(result) {
        const blendshape = result.faceBlendshapes && result.faceBlendshapes[0];
        if (!blendshape || !blendshape.categories) {
          return null;
        }

        const leftSmile = getBlendshapeScore(blendshape.categories, "mouthSmileLeft");
        const rightSmile = getBlendshapeScore(blendshape.categories, "mouthSmileRight");

        return (leftSmile + rightSmile) / 2;
      }

      function detectSmile() {
        if (video.currentTime !== lastVideoTime) {
          const result = faceLandmarker.detectForVideo(video, performance.now());
          const smileScore = readSmileScore(result);

          if (typeof smileScore === "number") {
            smoothedSmileScore = smoothedSmileScore * 0.7 + smileScore * 0.3;
            setResult(
              smoothedSmileScore >= smileThreshold ? "smiling" : "not-smiling",
              smoothedSmileScore
            );
          } else {
            smoothedSmileScore = 0;
            setResult("searching");
          }

          lastVideoTime = video.currentTime;
        }

        animationFrameId = requestAnimationFrame(detectSmile);
      }

      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          statusText.textContent = "This browser does not support camera access.";
          return;
        }

        startButton.disabled = true;
        startButton.textContent = "Loading detector...";
        statusText.textContent = "Loading smile detector...";
        setResult("searching");

        try {
          await loadFaceLandmarker();

          startButton.textContent = "Requesting camera...";
          statusText.textContent = "Waiting for camera permission...";

          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              width: { ideal: 800 },
              height: { ideal: 800 },
              facingMode: "user"
            },
            audio: false
          });

          video.srcObject = stream;
          await video.play();
          frame.classList.add("is-ready");
          startButton.style.display = "none";
          detectSmile();
        } catch (error) {
          startButton.disabled = false;
          startButton.textContent = "Try again";
          statusText.textContent =
            error.name === "NotAllowedError"
              ? "Camera permission was blocked. Allow camera access in your browser to continue."
              : "Could not start the camera or smile detector. Please check your camera and connection.";
          setResult("searching");
        }
      }

      startButton.addEventListener("click", startCamera);
      window.addEventListener("beforeunload", () => {
        cancelAnimationFrame(animationFrameId);

        const stream = video.srcObject;
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }
      });
    </script>
  </body>
</html>
